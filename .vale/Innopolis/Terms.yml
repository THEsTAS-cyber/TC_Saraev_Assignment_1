extends: substitution
message: "Согласно STYLEGUIDE.md, используйте '%s' вместо '%s'."
level: error
ignorecase: true
swap:
  # --- Section 3: Terminology & Principle 1 (Remove Verbal Noise) ---
  "utiliz(e|ed|ing|es)": "use"
  "utilise": "use"
  "perform configuration": "configure"
  "appropriate permissions": "Owner permission"
  "in order to": "to"
  "due to the fact that": "because"
  "functionality for report management": "create, filter, and export reports"
  
  # --- Principle 2: Actions Over Nouns ---
  "configuration of parameters must be performed": "Configure the parameters"
  "account connection is available": "To connect your account, go to"
  "selection of the template": "Choose a template"
  
  # --- Russian Specific Rules (Section 8 & General Infostyle) ---
  "виртуалка": "VM"
  "осуществить": "выполнить"
  "произвести настройку": "настроить"
  "произвести создание": "создать"
  "является": "— (используйте тире или перестройте фразу)"

---
extends: existence
message: "Согласно STYLEGUIDE.md, при первом упоминании используйте 'virtual machine (VM)' или 'ВМ', далее — просто 'VM'."
level: warning
ignorecase: true
tokens:
  - virtual machine
  - виртуальная машина

