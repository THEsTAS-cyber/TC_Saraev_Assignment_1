name: Build, Validate and Deploy Hugo Site

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Lint, Style & Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Vale Style Check
        uses: errata-ai/vale-action@reviewdog
        with:
          files: 'content/**/*.md'
          reporter: github-pr-check
          fail_on_error: true
        
      - name: Spell Check
        uses: streetsidesoftware/cspell-action@v5
        with:
          files: 'content/**/*.md'
          config: 'cspell.json'
          strict: true

      - name: Check Commit Message Format
        run: |
          # Проверяем все коммиты ветки, кроме merge commits
          echo "Проверяем сообщения коммитов..."
          
          # Получаем список коммитов текущей ветки (не merge commits)
          COMMITS=$(git log --oneline --no-merges origin/main..HEAD 2>/dev/null || git log --oneline --no-merges HEAD~5..HEAD)
          
          echo "Найдены коммиты:"
          echo "$COMMITS"
          
          # Проверяем каждый коммит
          FAILED=0
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            MSG=$(echo "$line" | sed 's/^[a-f0-9]* //')
            if ! echo "$MSG" | grep -qE "^(docs|fix|feat|chore|ci|style|test|refactor|perf):\s.+" ; then
              echo "❌ Несоответствующий коммит: $line"
              FAILED=1
            else
              echo "✅ Корректный коммит: $line"
            fi
          done <<< "$COMMITS"
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Ошибка: Некоторые коммиты не соответствуют формату Conventional Commits."
            echo "Пример: 'docs: add SSH connection guide'"
            echo "Разрешенные префиксы: docs, fix, feat, chore, ci, style, test, refactor, perf"
            exit 1
          fi
          
          echo "✅ Все сообщения коммитов корректны."

  build-and-check:
    name: Build & Link Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.0'
          extended: true

      - name: Determine Base URL
        id: vars
        run: |
          if [[ ${{ github.ref_name }} == 'main' ]]; then
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            ENVIRONMENT="production"
          else
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.ref_name }}/"
            ENVIRONMENT=${{ github.ref_name }}
          fi
          echo "BASE_URL=${BASE_URL}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Build with Hugo
        run: |
          hugo \
            --environment "${{ env.ENVIRONMENT }}" \
            --baseURL "${{ env.BASE_URL }}" \
            --minify \
            --printPathWarnings

      - name: Link Checker (Lychee)
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          args: >-
            --verbose 
            --no-progress 
            --exclude 'localhost' 
            --exclude 'vm\.innopolis\.university' 
            --exclude 'sso\.university\.innopolis\.ru'
            'public/**/*.html'
          fail: true

      - name: Upload Hugo build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: ./public
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-check
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Hugo build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-public
          path: ./public

      - name: Deploy to GitHub Pages (Production)
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false

      - name: Deploy to GitHub Pages (Stage)
        if: github.ref_name == 'stage'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          destination_dir: stage
          keep_files: true