name: Bug Report
description: Report a bug
title: "[BUG] Short title"
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
    validations:
      required: false