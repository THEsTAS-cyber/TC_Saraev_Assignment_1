name: Build, Validate and Deploy Hugo Site

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Lint, Style & Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Vale Style Check
        uses: errata-ai/vale-action@reviewdog
        with:
          files: 'content/**/*.md'
          reporter: github-pr-check
          fail_on_error: true
        
      - name: Spell Check
        uses: streetsidesoftware/cspell-action@v5
        with:
          files: 'content/**/*.md'
          config: 'cspell.json'
          strict: true

      - name: Check Commit Message Format
        run: |
          echo "Проверяем сообщения коммитов..."
          
          # Получаем список заголовков последних коммитов
          COMMITS=$(git log --format="%s" -n 5 2>/dev/null)
          
          echo "Найдены коммиты:"
          echo "$COMMITS"
          
          FAILED=0
          while IFS= read -r MSG; do
            if [ -z "$MSG" ]; then
              continue
            fi
            
            # Пропускаем ВСЕ merge commits (они создаются автоматически GitHub)
            # Это покрывает все форматы: "Merge pull request...", "Merge branch...", "Merge <hash> into..."
            if echo "$MSG" | grep -qE "^Merge "; then
              echo "⏭️  Пропущен merge commit: $MSG"
              continue
            fi
            
            # Проверяем формат Conventional Commits
            if ! echo "$MSG" | grep -qE "^(docs|fix|feat|chore|ci|style|test|refactor|perf):\s.+" ; then
              echo "❌ Несоответствующий коммит: $MSG"
              FAILED=1
            else
              echo "✅ Корректный коммит: $MSG"
            fi
          done <<< "$COMMITS"
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Ошибка: Некоторые коммиты не соответствуют формату Conventional Commits."
            echo "Разрешенные префиксы: docs, fix, feat, chore, ci, style, test, refactor, perf"
            exit 1
          fi
          
          echo "✅ Все сообщения коммитов корректны."

  build-and-check:
    name: Build & Link Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.0'
          extended: true

      - name: Determine Base URL
        id: vars
        run: |
          # Если это ветка main и это НЕ pull request, используем production URL
          # Во всех остальных случаях (ветка stage или любой PR) используем чистый /stage/ URL.
          # Это предотвращает появление артефактов типа "/13/merge/" в ссылках.
          if [[ "${{ github.ref_name }}" == "main" && "${{ github.event_name }}" != "pull_request" ]]; then
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            ENVIRONMENT="production"
          else
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stage/"
            ENVIRONMENT="stage"
          fi
          
          echo "BASE_URL=${BASE_URL}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV
          echo "✅ Clean BASE_URL set to: $BASE_URL"

      - name: Build with Hugo
        run: |
          hugo \
            --environment "${{ env.ENVIRONMENT }}" \
            --baseURL "${{ env.BASE_URL }}" \
            --minify \
            --printPathWarnings

      - name: Link Checker (Lychee)
        uses: lycheeverse/lychee-action@v1.10.0
        with:
          args: >-
            --verbose 
            --no-progress 
            --remap "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stage/ ./public/"
            --remap "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ ./public/"
            --exclude 'localhost' 
            --exclude 'vm\.innopolis\.university' 
            --exclude 'sso\.university\.innopolis\.ru'
            'public/**/*.html'
          fail: true

      - name: Upload Hugo build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: ./public
          retention-days: 1

      - name: Upload Hugo build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: ./public
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-check
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Hugo build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-public
          path: ./public

      - name: Deploy to GitHub Pages (Production)
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false

      - name: Deploy to GitHub Pages (Stage)
        if: github.ref_name == 'stage'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          destination_dir: stage
          keep_files: true