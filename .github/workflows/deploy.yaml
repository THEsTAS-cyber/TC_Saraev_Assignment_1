name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.0'
          extended: true

      - name: Determine Base URL and Environment
        id: vars
        run: |
          if [[ ${{ github.ref_name }} == 'main' ]]; then
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            ENVIRONMENT="production"
          else
            BRANCH_NAME=${{ github.ref_name }}
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$BRANCH_NAME/"
            ENVIRONMENT=$BRANCH_NAME
          fi
          echo "BASE_URL=${BASE_URL}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV
          echo "Determined baseURL: ${BASE_URL}"
          echo "Determined environment: ${ENVIRONMENT}"

      - name: Build with Hugo
        run: |
          hugo \
            --environment "${{ env.ENVIRONMENT }}" \
            --baseURL "${{ env.BASE_URL }}" \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main' || github.ref_name == 'stage'
    environment:
      name: ${{ github.ref_name == 'main' || 'stage' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4